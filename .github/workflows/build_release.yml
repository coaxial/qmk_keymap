name: Build and release firmware
on: [push, pull_request]

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - coaxial.json
    env:
      QMK_HOME: /home/runner/work/qmk_keymap/qmk_keymap/qmk_firmware

    steps:
      - name: Set user variable
        id: set_var
        run: |
          if [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            echo "username=${{ github.actor }}" >> $GITHUB_OUTPUT
          else
            echo "username=coaxial" >> $GITHUB_OUTPUT
          fi

      - name: Get QMK latest commit SHA
        id: qmk-sha
        run: echo "sha=$(curl -s https://api.github.com/repos/qmk/qmk_firmware/commits/master | jq -r .sha)" >> $GITHUB_OUTPUT

      - name: Cache QMK firmware
        uses: actions/cache@v6
        with:
          path: qmk_firmware
          key: ${{ runner.os }}-qmk-${{ steps.qmk-sha.outputs.sha }}-${{ steps.set_var.outputs.username }}
          restore-keys: ${{ runner.os }}-qmk-

      - name: Get QMK firmware
        uses: actions/checkout@v7
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Checkout userspace
        uses: actions/checkout@v7
        with:
          path: qmk_firmware/users/${{ steps.set_var.outputs.username }}

      # This avoids updating the man db every time which is slow and
      # unnecessary
      - name: Configure apt
        run: |
          echo 'path-exclude /usr/share/man/*' | sudo tee /etc/dpkg/dpkg.cfg.d/01_no_man
          echo 'path-exclude /usr/share/groff/*' | sudo tee -a /etc/dpkg/dpkg.cfg.d/01_no_man
          echo 'path-exclude /usr/share/info/*' | sudo tee -a /etc/dpkg/dpkg.cfg.d/01_no_man
          echo 'path-exclude /usr/share/lintian/*' | sudo tee -a /etc/dpkg/dpkg.cfg.d/01_no_man
          echo 'path-exclude /usr/share/locale/*' | sudo tee -a /etc/dpkg/dpkg.cfg.d/01_no_manauto-update

      - name: Install dependencies
        run: |
          sudo qmk_firmware/util/qmk_install.sh

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: qmk_firmware/users/${{ steps.set_var.outputs.username }}/requirements.txt

      - name: Install Python dependencies
        run: pip install -r qmk_firmware/users/${{ steps.set_var.outputs.username }}/requirements.txt

      - name: Setup QMK
        run: |
          qmk setup -y

      - name: Generate keymap SVG
        if: github.actor != 'dependabot[bot]'
        run: |
          cd qmk_firmware/users/${{ steps.set_var.outputs.username }}
          keymap -c drawer_config.yaml parse -q coaxial.json | keymap -c drawer_config.yaml draw - > coaxial.svg
          cd -
          mv qmk_firmware/users/${{ steps.set_var.outputs.username }}/coaxial.svg .

      - name: Build firmware
        run: |
          cd qmk_firmware/
          qmk --version
          qmk compile "users/${{ steps.set_var.outputs.username }}/${{ matrix.file }}"

      - name: Move firmware to root
        if: github.actor != 'dependabot[bot]'
        run: mv qmk_firmware/*.hex .

      - name: Upload firmware and SVG
        if: github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.actor }}
          path: |
            *.hex
            coaxial.svg
          retention-days: 5

  commit_svg:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.actor }}

      - name: Commit and push updated SVG
        if: github.actor != 'dependabot[bot]'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add coaxial.svg
          git commit -m 'docs: update keymap SVG [skip ci]' || echo "No changes to commit"
          git push

  pr_comment:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.actor }}

      - name: Upload SVG
        id: upload-svg
        uses: McCzarny/upload-image@v2.0.5
        with:
          path: coaxial.svg
          upload-method: cloudinary
          api-key: ${{ secrets.CLOUDINARY_API_KEY }}
          api-secret: ${{ secrets.CLOUDINARY_API_SECRET }}
          cloud-name: ${{ secrets.CLOUDINARY_CLOUD_NAME }}

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "New keymap layout preview"

      - name: Create or update PR comment with SVG
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            ## New keymap layout preview

            ![Keymap SVG](${{ steps.upload-svg.outputs.url }})

  release:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.actor != 'dependabot[bot]'
    # Needs all the commits to run correctly, including the SVG commit
    needs:
      - build
      - commit_svg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.actor }}

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
