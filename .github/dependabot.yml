version: 2
updates:
  # NPM dependencies (from package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      npm-dependencies:
        patterns:
          - "*"  # Groups all npm updates into one PR
        update-types:
          - "minor"
          - "patch"

  # Python dependencies (from requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      python-dependencies:
        patterns:
          - "*"  # Groups all pip updates into one PR
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (from .github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"  # Groups all action updates into one PR
        update-types:
          - "minor"
          - "patch"
